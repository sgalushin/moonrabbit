name: Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/api
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
      - name: Install cargo-lambda
        env:
          VERSION: v1.9.2
          SHA256: b5c258c424ebaef39541c3641f33c51137ee6c426016f365628fedb2c737271d
        run: |
          curl -fsSLo cargo-lambda.tar.gz "https://github.com/cargo-lambda/cargo-lambda/releases/download/${VERSION}/cargo-lambda-${VERSION}.x86_64-unknown-linux-musl.tar.gz"
          echo "${SHA256}  cargo-lambda.tar.gz" | sha256sum --check
          tar -xzf cargo-lambda.tar.gz -C ~/.cargo/bin
          rm cargo-lambda.tar.gz
          cargo lambda --version
      - name: Format
        run: pnpm exec nx format:check --all
      - name: Lint, type-check, test, and build
        run: pnpm exec nx run-many -t lint typecheck test build
      - name: Synth
        run: pnpm exec cdk synth --strict --quiet
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          OPENROUTER_API_KEY: dummy
          STAGE: prod
      - name: Upload build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/apps/web/browser
            apps/api/target/lambda/api
          if-no-files-found: error
          retention-days: 7
